name: Register Revenue Swarm on 402 Index

on:
  push:
    paths:
      - ".github/workflows/register-revenue-swarm-402index.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register x402 endpoints
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="$(git log -1 --format=%ae)"
          register() {
            curl --fail-with-body --silent --show-error \
              -X POST "https://402index.io/api/v1/register" \
              -H "Content-Type: application/json" \
              --data "$1"
            echo
          }
          register "{\"url\":\"https://eu-tender-x402-v3-production.up.railway.app/api/tender-pulse\",\"name\":\"Revenue Swarm EU Tender Pulse\",\"protocol\":\"x402\",\"http_method\":\"GET\",\"description\":\"Strongest matching live EU public-procurement opportunity with buyer, deadline and official source evidence.\",\"price_usd\":0.001,\"payment_asset\":\"USDC\",\"payment_network\":\"Base\",\"category\":\"procurement\",\"provider\":\"Revenue Swarm\",\"contact_email\":\"$EMAIL\"}"
          register "{\"url\":\"https://eu-tender-x402-v3-production.up.railway.app/api/tenders\",\"name\":\"Revenue Swarm EU Tender Search\",\"protocol\":\"x402\",\"http_method\":\"GET\",\"description\":\"Ranked EU tender search for suppliers, consultants and agents with buyer, value, deadline and official source evidence.\",\"price_usd\":0.01,\"payment_asset\":\"USDC\",\"payment_network\":\"Base\",\"category\":\"procurement\",\"provider\":\"Revenue Swarm\",\"contact_email\":\"$EMAIL\"}"
          register "{\"url\":\"https://eu-tender-x402-v3-production.up.railway.app/api/tender-intelligence\",\"name\":\"Revenue Swarm EU Tender Intelligence\",\"protocol\":\"x402\",\"http_method\":\"GET\",\"description\":\"Deeper ranked EU public-procurement shortlist sourced from TED for business-development and agent workflows.\",\"price_usd\":0.10,\"payment_asset\":\"USDC\",\"payment_network\":\"Base\",\"category\":\"procurement\",\"provider\":\"Revenue Swarm\",\"contact_email\":\"$EMAIL\"}"
