name: Mermail Tender Desk

on:
  push:
    paths:
      - "mermail-tender-desk/**"
      - ".github/workflows/mermail-tender-desk.yml"
  pull_request:
    paths:
      - "mermail-tender-desk/**"
      - ".github/workflows/mermail-tender-desk.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate companion skill
        run: node mermail-tender-desk/tests/validate.mjs
      - name: Run synthetic tender demo assertions
        run: node mermail-tender-desk/tests/demo.test.mjs
      - name: Run adversarial procurement safety scenarios
        run: node mermail-tender-desk/tests/adversarial.test.mjs
