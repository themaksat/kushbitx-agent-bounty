name: Test bounty integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check src/agent.mjs
      - run: node --check src/smoke.mjs

      - name: Install Ollama
        if: github.event_name != 'pull_request'
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start local model
        if: github.event_name != 'pull_request'
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/version && break
            sleep 1
          done
          ollama pull qwen3:1.7b

      - name: Run genuine model-directed agent flow
        if: github.event_name != 'pull_request'
        env:
          OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
          OLLAMA_MODEL: qwen3:1.7b
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        run: npm run agent | tee evidence/run-output.txt

      - name: Commit verified sanitized evidence
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/run-output.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add verified model-directed agent evidence"
          git push
