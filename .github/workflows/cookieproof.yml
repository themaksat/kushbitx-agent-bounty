name: CookieProof

on:
  push:
    paths:
      - "cookieproof/**"
      - ".github/workflows/cookieproof.yml"
  pull_request:
    paths:
      - "cookieproof/**"
      - ".github/workflows/cookieproof.yml"

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cookieproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
