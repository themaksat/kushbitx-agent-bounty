name: Distribute Revenue Swarm v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/distribute-revenue-swarm-v3.yml

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Agent402
        run: |
          curl -sS -L --max-time 30 -X POST https://agent402.tools/api/index/register \
            -H 'content-type: application/json' \
            --data '{"origin":"https://eu-tender-x402-v3-production.up.railway.app"}' \
            -w '\nHTTP_STATUS=%{http_code}\n' || true

      - name: Market402
        run: |
          for resource in \
            https://eu-tender-x402-v3-production.up.railway.app/api/tender-pulse \
            https://eu-tender-x402-v3-production.up.railway.app/api/tenders \
            https://eu-tender-x402-v3-production.up.railway.app/api/tender-intelligence
          do
            payload=$(jq -nc --arg resource "$resource" '{resource:$resource}')
            echo "Submitting $resource"
            curl -sS -L --max-time 30 -X POST https://market402.com/submit \
              -H 'content-type: application/json' \
              --data "$payload" \
              -w '\nHTTP_STATUS=%{http_code}\n' || true
          done

      - name: nohumans
        run: |
          p1=$(jq -nc '{name:"Revenue Swarm - EU Tender Pulse",description:"Strongest matching live EU public-procurement opportunity with buyer, deadline and official source evidence.",endpoint_url:"https://eu-tender-x402-v3-production.up.railway.app/api/tender-pulse",category:"data.procurement",price_amount:0.001,price_currency:"USDC",chains:["base"]}')
          p2=$(jq -nc '{name:"Revenue Swarm - EU Tender Search",description:"Ranked EU tender search with buyer, value, deadline and official source evidence.",endpoint_url:"https://eu-tender-x402-v3-production.up.railway.app/api/tenders",category:"data.procurement",price_amount:0.01,price_currency:"USDC",chains:["base"]}')
          p3=$(jq -nc '{name:"Revenue Swarm - EU Tender Intelligence",description:"Deeper ranked EU public-procurement shortlist sourced from TED.",endpoint_url:"https://eu-tender-x402-v3-production.up.railway.app/api/tender-intelligence",category:"data.procurement",price_amount:0.10,price_currency:"USDC",chains:["base"]}')
          for payload in "$p1" "$p2" "$p3"
          do
            curl -sS -L --max-time 30 -X POST https://api.nohumans.directory/v1/listings \
              -H 'content-type: application/json' \
              --data "$payload" \
              -w '\nHTTP_STATUS=%{http_code}\n' || true
          done
